<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熱血籃球 · 首頁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">🔥 熱血籃球</div>
        <nav class="navbar">
            <a href="index.html" class="active">首頁</a>
            <a href="products.html">球鞋裝備</a>
            <a href="contact.html">聯絡我們</a>
        </nav>
    </header>

    <main>
        <!-- 輪播區塊 -->
        <section class="carousel-section">
            <div class="carousel-container">
                <div class="carousel-slide">
                    <img src="https://picsum.photos/id/1015/1200/500?grayscale&blur=1" alt="熱血球場1" class="carousel-img">
                    <img src="https://picsum.photos/id/1043/1200/500?grayscale&blur=1" alt="熱血球場2" class="carousel-img">
                    <img src="https://picsum.photos/id/106/1200/500?grayscale&blur=1" alt="熱血球場3" class="carousel-img">
                </div>
                <button class="carousel-btn prev" aria-label="上一張">❮</button>
                <button class="carousel-btn next" aria-label="下一張">❯</button>
                <div class="carousel-dots"></div>
            </div>
        </section>

        <!-- 首頁主要內容 -->
        <section class="hero">
            <h1>上場，就是現在</h1>
            <p>【熱血籃球】系列裝備，陪你燃燒每一滴汗水，征服每一個籃框。</p>
            <a href="products.html" class="cta-btn">探索裝備</a>
        </section>

        <section class="features">
            <div class="feature-card">
                <h2>🔥 爆發力</h2>
                <p>高回彈中底與抓地大底，啟動快攻零延遲，第一步就甩開防守。</p>
            </div>
            <div class="feature-card">
                <h2>💪 對抗性</h2>
                <p>強化鞋面與側向支撐，激烈碰撞依然穩定，禁區卡位不退讓。</p>
            </div>
            <div class="feature-card">
                <h2>🏀 熱血魂</h2>
                <p>球場經典配色與塗裝，穿上就讓人想衝上場拚一顆致勝球。</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2025 熱血籃球 · 每一球都全力以赴</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
